aid: ferrum-health
name: Ferrum Health
description: 'Ferrum Health is a healthcare AI governance company whose AI Governance
  Suite lets health systems deploy, validate, orchestrate, and monitor clinical AI
  models securely behind their own firewall, without protected health information leaving
  the health system. The vendor-neutral, privately deployed platform integrates once
  with existing EMR, PACS, and worklist infrastructure, then routes every clinical
  AI model — FDA-cleared, CE-marked, open-source, or homegrown — through a single secure
  path via its Deployment Fabric, curates 60+ applications in its Model Hub across
  radiology, cardiology, oncology, neurology, and musculoskeletal specialties, and
  continuously links predictions, ground truth, and outcomes for bias and drift detection
  through its Observability Lens. It is SOC 2 Type II, ISO 27001, HIPAA, and GDPR aligned,
  and is used by Sutter Health, Carle Health, and 250+ sites.'
